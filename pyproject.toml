[project]
name = "heartbeat360"
version = "2.0.0"
description = "HeartBeat 360 - Multimodal Healthcare Assistant"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "aiofiles>=23.2.0",
    "mangum>=0.17.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "Pillow>=10.0.0",
    "huggingface_hub>=0.26"
]

[tool.vercel]
entrypoint = "api/index.py"
