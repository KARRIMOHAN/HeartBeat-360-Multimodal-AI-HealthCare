services:
  - type: web
    name: heartbeat-360
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: API_HOST
        value: 0.0.0.0
      - key: HF_API_TOKEN
        sync: false
