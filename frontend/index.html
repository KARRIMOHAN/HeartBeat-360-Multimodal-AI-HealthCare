<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartBeat 360 — Multimodal Healthcare Assistant</title>
  <meta name="description" content="AI-assisted, doctor-reviewed multimodal healthcare assistant for patient triage, medicine scanning, report analysis, and doctor booking.">
  
  <!-- Force browser to always fetch fresh assets (No Cache) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles with Cache Buster -->
  <link rel="stylesheet" href="css/styles.css?v=8.9.0">
  <link rel="stylesheet" href="src/components/DashboardSection.css?v=8.9.0">
  <link rel="stylesheet" href="src/components/HeroBackground.css?v=8.9.0">
  
  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="antialiased">
  <div id="root"></div>

  <!-- App Script with Cache Buster -->
  <script type="text/babel" src="js/app.js?v=8.9.0"></script>
</body>
</html>
